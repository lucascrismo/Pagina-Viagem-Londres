<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas viagens</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div class="w">
  <section id="home"></section>
  <section id="viagem" hidden>
  <header>
    <div class="acoes" style="margin:0 0 12px"><button class="btn sec" data-volta="1">← Minhas viagens</button><button class="btn sec" data-ev="1">Editar viagem</button></div>
    <h1 id="h1"></h1>
    <p id="sub"></p>
  </header>
  <nav id="abas">
    <button data-aba="resumo" class="on">Resumo</button>
    <button data-aba="gastos">Gastos</button>
    <button data-aba="roteiro">Roteiro</button>
    <button data-aba="aportes">Aportes</button>
    <button data-aba="cambio">Câmbio</button>
    <button data-aba="despesas">Despesas</button>
    <button data-aba="dados">Dados</button>
  </nav>
  <main>
    <div id="resumo"></div>
    <div id="gastos" hidden></div>
    <div id="roteiro" hidden></div>
    <div id="aportes" hidden></div>
    <div id="cambio" hidden><div id="conv"></div><div id="dolar"></div></div>
    <div id="despesas" hidden><div id="dp_form"></div><div id="dp_lista"></div></div>
    <div id="dados" hidden>
      <div class="card">
        <h2>Backup e importação desta viagem</h2>
        <p class="vazio">Os dados ficam guardados neste navegador. Exporte um backup de vez em quando e use Importar para carregar os dados em outro aparelho.</p>
        <div class="acoes">
          <button class="btn" id="exp">Exportar backup</button>
          <button class="btn sec" id="imp">Importar arquivo</button>
          <button class="btn perigo" id="lim">Apagar tudo</button>
        </div>
        <input type="file" id="arq" accept="application/json,.json" hidden>
      </div>
    </div>
  </main>
  </section>
</div>

<dialog id="dv">
  <h2 id="dv_t">Viagem</h2>
  <label>Nome<input id="dv_nome" placeholder="Ex.: Paris 2028"></label>
  <label>Destino<input id="dv_dest"></label>
  <label>Data de saída<input type="date" id="dv_saida"></label>
  <label>Moeda local<select id="dv_moeda"></select></label>
  <label>Forma do emblema<select id="dv_forma"><option value="roundel">Anel e barra (metrô de Londres)</option><option value="circulo">Círculo cheio</option><option value="anel">Anel</option><option value="imagem">Imagem (círculo)</option><option value="imagemq">Imagem (quadrado arredondado)</option></select></label>
  <div id="dv_img_box" hidden>
    <label>Imagem (foto ou desenho)<input type="file" id="dv_img" accept="image/*"></label>
    <label>Zoom<input type="range" id="dv_zoom" min="1" max="3" step="0.05" value="1"></label>
    <label>Posição horizontal<input type="range" id="dv_ox" min="0" max="100" value="50"></label>
    <label>Posição vertical<input type="range" id="dv_oy" min="0" max="100" value="50"></label>
    <p class="vazio">A imagem é reduzida automaticamente. A cor 1 vira a borda do emblema.</p>
  </div>
  <div class="cfg"><label>Cor 1<input type="color" id="dv_c1"></label><label>Cor 2<input type="color" id="dv_c2"></label></div>
  <div class="acoes"><button class="btn sec" data-pre="londres">Londres</button><button class="btn sec" data-pre="paris">Paris</button><button class="btn sec" data-pre="novayork">Nova York</button><button class="btn sec" data-pre="orlando">Orlando</button></div>
  <div id="dv_prev" style="max-width:180px;margin:12px auto"></div>
  <div class="acoes"><button class="btn" id="dv_sal">Salvar</button><button class="btn sec" id="dv_can">Cancelar</button><button class="btn perigo" id="dv_exc">Excluir viagem</button></div>
</dialog>

<dialog id="di">
  <h2 id="di_t">Item</h2>
  <label>Horário<input id="di_hora" placeholder="Ex.: 09:20–11:30"></label>
  <label>Atração / atividade<input id="di_nome"></label>
  <label>Duração<input id="di_dur" placeholder="Ex.: 1h30"></label>
  <label>Preço individual (moeda local; vazio = gratuito)<input type="number" step="any" inputmode="decimal" id="di_preco"></label>
  <div id="di_passes"></div>
  <label>Reserva<select id="di_res"><option value="">Sem reserva necessária</option><option value="pend">Falta reservar (à parte)</option><option value="passe">Falta reservar (dentro do passe)</option><option value="ok">Reservado, tudo certo</option></select></label>
  <label>Observação (links viram botões)<textarea id="di_obs" rows="3"></textarea></label>
  <div class="acoes"><button class="btn" id="di_sal">Salvar</button><button class="btn sec" id="di_can">Cancelar</button><button class="btn perigo" id="di_exc">Excluir</button></div>
</dialog>

<dialog id="dy">
  <h2 id="dy_t">Dia</h2>
  <label>Data<input type="date" id="dy_data"></label>
  <label>Título<input id="dy_tit" placeholder="Ex.: Westminster + Harrods"></label>
  <div class="acoes"><button class="btn" id="dy_sal">Salvar</button><button class="btn sec" id="dy_can">Cancelar</button><button class="btn perigo" id="dy_exc">Excluir dia</button></div>
</dialog>

<dialog id="dlg">
  <h2 id="dt">Item</h2>
  <label>Nome<input id="f_nome"></label>
  <label>Quantidade<input id="f_qtd" type="number" step="any" inputmode="decimal"></label>
  <label>Valor unitário (R$)<input id="f_valor" type="number" step="any" inputmode="decimal"></label>
  <label>Pessoas<input id="f_pax" type="number" step="1" inputmode="numeric"></label>
  <label>Total fixo em R$ (opcional, substitui o cálculo)<input id="f_fixo" type="number" step="any" inputmode="decimal"></label>
  <label>Observação<input id="f_obs"></label>
  <label>Status<select id="f_pago"><option value="0">Pendente</option><option value="1">Pago</option></select></label>
  <div class="acoes">
    <button class="btn" id="sal">Salvar</button>
    <button class="btn sec" id="can">Cancelar</button>
    <button class="btn perigo" id="exc">Excluir</button>
  </div>
</dialog>

<script src="app.js?v=9"></script>
</body>
</html>
